apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenticupi-ingress
  namespace: agenticupi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - host: agenticupi.local
      http:
        paths:
          # Route Core Payment APIs to Spring Boot
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 8080
          # Route Agent Requests to Python Agent
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: agent-svc
                port:
                  number: 8000
