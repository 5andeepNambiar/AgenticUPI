spring:
  application:
    name: agenticupi-backend

  datasource:
    url: jdbc:mariadb://agenticupi_db:3306/agenticupi?rewriteBatchedStatements=true
    username: api_user
    password: api_password
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate # We manage schema strictly via our init.sql / flyway
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all     # Highest durability for financial events
      retries: 3
    consumer:
      group-id: agenticupi-group
      auto-offset-reset: earliest

server:
  port: 8080

logging:
  level:
    com.agenticupi: DEBUG
    org.springframework.orm.jpa: INFO
