version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: agenticupi_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenticupi
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_password
    ports:
      - "3306:3306"
    volumes:
      - ./infrastructure/mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agenticupi_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: agenticupi_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: agenticupi_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # (Optional for future) We can uncomment these to run the actual services inside docker
  backend:
    build: ./backend-java
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  python-agent:
    build: ./agent-python
    ports:
      - "8000:8000"
    environment:
      AGENTIC_UPI_BASE_URL: "http://backend:8080"
      AGENTIC_UPI_AGENT_ID: "agent_demo_1"
      AGENTIC_UPI_SECRET: "my_raw_db_secret"
    depends_on:
      - backend

  frontend:
    build: ./frontend-angular
    ports:
      - "4200:4200"
    depends_on:
      - backend
