apiVersion: v1
kind: Namespace
metadata:
  name: agenticupi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenticupi-config
  namespace: agenticupi
data:
  DB_HOST: "postgres-svc"
  DB_PORT: "5432"
  DB_NAME: "agenticupi"
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-svc:9092"
  AGENTIC_UPI_BASE_URL: "http://backend-svc:8080"
  AGENTIC_UPI_AGENT_ID: "agent_demo_1"
  GRPC_AGENT_HOST: "agent-svc"
---
apiVersion: v1
kind: Secret
metadata:
  name: agenticupi-secrets
  namespace: agenticupi
type: Opaque
stringData:
  DB_USER: "api_user"
  DB_PASSWORD: "api_password"
  AGENTIC_UPI_SECRET: "my_raw_db_secret"
